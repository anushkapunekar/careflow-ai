<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CareFlow AI</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            max-width: 800px;

            margin: 50px auto;

            padding: 20px;

            background: #f5f7fa;
        }


        h1 {

            margin-bottom: 5px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;
        }


        .controls {

            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }


        button {

            padding: 12px 20px;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
        }


        #startButton {

            background: #2563eb;

            color: white;
        }


        #stopButton {

            background: #dc2626;

            color: white;
        }


        button:disabled {

            opacity: 0.5;

            cursor: not-allowed;
        }


        #status {

            padding: 12px;

            background: white;

            border-radius: 8px;

            margin-bottom: 20px;
        }


        #conversation {

            background: white;

            padding: 20px;

            border-radius: 10px;

            min-height: 300px;
        }


        .message {

            margin-bottom: 15px;

            padding: 12px;

            border-radius: 8px;
        }


        .user {

            background: #e0ecff;
        }


        .assistant {

            background: #e8f5e9;
        }


        .label {

            font-weight: bold;

            margin-bottom: 5px;
        }

    </style>

</head>


<body>


    <h1>CareFlow AI</h1>


    <div class="subtitle">

        AI Voice Receptionist Prototype

    </div>


    <div class="controls">


        <button id="startButton">

            🎙️ Start Talking

        </button>


        <button
            id="stopButton"
            disabled
        >

            ⏹ Stop

        </button>


    </div>


    <div id="status">

        Ready.

    </div>


    <div id="conversation"></div>



    <script>


        // ==================================================
        // DOM ELEMENTS
        // ==================================================

        const startButton =
            document.getElementById("startButton");


        const stopButton =
            document.getElementById("stopButton");


        const status =
            document.getElementById("status");


        const conversation =
            document.getElementById("conversation");



        // ==================================================
        // CONVERSATION ID
        // ==================================================

        const conversationId =
            "voice-" + crypto.randomUUID();



        // ==================================================
        // APPLICATION STATE
        // ==================================================

        let isListening =
            false;


        let isSpeaking =
            false;


        let isProcessing =
            false;


        /*
         * Tracks whether the user has started
         * an active voice conversation.
         *
         * When true, CareFlow automatically
         * reopens the microphone after speaking.
         */

        let voiceSessionActive =
            false;


        let selectedVoice =
            null;


        let speechPauseTimer =
            null;


        let speechGeneration =
            0;



        // ==================================================
        // SPEECH RECOGNITION
        // ==================================================

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            status.textContent =
                "Speech recognition is not supported in this browser.";

            startButton.disabled =
                true;
        }


        const recognition =
            SpeechRecognition
                ? new SpeechRecognition()
                : null;



        // ==================================================
        // CONFIGURE SPEECH RECOGNITION
        // ==================================================

        if (recognition) {

            recognition.lang =
                "en-US";


            recognition.interimResults =
                false;


            recognition.continuous =
                false;



            // ==================================================
            // RECOGNITION START
            // ==================================================

            recognition.onstart =
                () => {

                    isListening =
                        true;


                    status.textContent =
                        "Listening... Speak now.";


                    startButton.disabled =
                        true;


                    stopButton.disabled =
                        false;
                };



            // ==================================================
            // SPEECH RESULT
            // ==================================================

            recognition.onresult =
                async (event) => {

                    /*
                     * Prevent duplicate submissions.
                     */

                    if (isProcessing) {

                        return;
                    }


                    const transcript =
                        event.results[0][0]
                            .transcript
                            .trim();


                    if (!transcript) {

                        return;
                    }


                    isProcessing =
                        true;


                    isListening =
                        false;


                    addMessage(
                        "You",
                        transcript,
                        "user"
                    );


                    status.textContent =
                        "Thinking...";


                    await sendToAgent(
                        transcript
                    );


                    isProcessing =
                        false;


                    /*
                     * If speech has already finished,
                     * allow the user to speak again.
                     *
                     * The active voice session will normally
                     * reopen the microphone automatically from
                     * speakNextChunk().
                     */

                    if (!isSpeaking) {

                        if (voiceSessionActive) {

                            startButton.disabled =
                                true;

                            stopButton.disabled =
                                false;

                        } else {

                            startButton.disabled =
                                false;

                            stopButton.disabled =
                                true;
                        }
                    }
                };



            // ==================================================
            // RECOGNITION ERROR
            // ==================================================

            recognition.onerror =
                (event) => {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );


                    isListening =
                        false;


                    /*
                     * "aborted" normally happens when
                     * the user intentionally presses Stop.
                     */

                    if (
                        event.error ===
                        "aborted"
                    ) {

                        return;
                    }


                    status.textContent =
                        "Speech recognition error: " +
                        event.error;


                    if (
                        !isSpeaking &&
                        !isProcessing
                    ) {

                        if (voiceSessionActive) {

                            /*
                             * Keep the session active,
                             * but allow the user to manually
                             * restart if recognition failed.
                             */

                            startButton.disabled =
                                false;

                            stopButton.disabled =
                                false;

                        } else {

                            startButton.disabled =
                                false;

                            stopButton.disabled =
                                true;
                        }
                    }
                };



            // ==================================================
            // RECOGNITION END
            // ==================================================

            recognition.onend =
                () => {

                    isListening =
                        false;


                    /*
                     * Never enable the microphone while
                     * CareFlow is processing or speaking.
                     */

                    if (
                        isProcessing ||
                        isSpeaking
                    ) {

                        startButton.disabled =
                            true;

                    } else if (
                        voiceSessionActive
                    ) {

                        /*
                         * The active voice session is controlled
                         * by speakNextChunk(). Do not immediately
                         * restart recognition here because Chrome
                         * can reject a start() occurring too close
                         * to an onend event.
                         */

                        startButton.disabled =
                            true;

                    } else {

                        startButton.disabled =
                            false;
                    }


                    stopButton.disabled =
                        !(
                            isSpeaking ||
                            voiceSessionActive
                        );
                };
        }



        // ==================================================
        // START TALKING
        // ==================================================

        startButton.addEventListener(
            "click",
            () => {

                if (!recognition) {

                    return;
                }


                /*
                 * Activate the continuous voice session.
                 *
                 * CareFlow will automatically listen again
                 * after each assistant response.
                 */

                voiceSessionActive =
                    true;


                /*
                 * Do not start a second request while
                 * the current request is processing.
                 */

                if (isProcessing) {

                    return;
                }


                /*
                 * If CareFlow is currently speaking,
                 * stop it before listening.
                 */

                if (isSpeaking) {

                    stopSpeech();
                }


                if (isListening) {

                    return;
                }


                try {

                    recognition.start();

                } catch (error) {

                    console.error(
                        "Could not start recognition:",
                        error
                    );
                }
            }
        );



        // ==================================================
        // STOP
        // ==================================================

        stopButton.addEventListener(
            "click",
            () => {

                /*
                 * Completely end the voice session.
                 *
                 * This prevents the microphone from
                 * automatically reopening after Stop.
                 */

                voiceSessionActive =
                    false;


                if (
                    recognition &&
                    isListening
                ) {

                    recognition.stop();

                    isListening =
                        false;
                }


                stopSpeech();


                stopButton.disabled =
                    true;


                if (isProcessing) {

                    startButton.disabled =
                        true;

                    return;
                }


                startButton.disabled =
                    false;


                status.textContent =
                    "Ready.";
            }
        );



        // ==================================================
        // STOP SPEECH
        // ==================================================

        function stopSpeech() {

            /*
             * Invalidate every speech callback
             * belonging to the previous speech session.
             */

            speechGeneration++;


            /*
             * Stop browser speech synthesis.
             */

            window.speechSynthesis.cancel();


            /*
             * Cancel any waiting pause.
             */

            if (
                speechPauseTimer !== null
            ) {

                clearTimeout(
                    speechPauseTimer
                );

                speechPauseTimer =
                    null;
            }


            isSpeaking =
                false;
        }



        // ==================================================
        // SEND MESSAGE TO CAREFLOW AGENT
        // ==================================================

        async function sendToAgent(message) {

            try {

                const response =
                    await fetch(
                        "/api/chat",
                        {
                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                conversation_id:
                                    conversationId,

                                message:
                                    message
                            })
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `Agent API returned ${response.status}`
                    );
                }


                const data =
                    await response.json();


                const reply =
                    data.response;


                if (!reply) {

                    throw new Error(
                        "Agent returned an empty response."
                    );
                }


                /*
                 * Display exactly what the model returned.
                 */

                addMessage(
                    "CareFlow AI",
                    reply,
                    "assistant"
                );


                /*
                 * Speak the response.
                 */

                speak(reply);


            } catch (error) {

                console.error(
                    "Agent request failed:",
                    error
                );


                status.textContent =
                    "Could not connect to CareFlow AI.";


                stopSpeech();


                isProcessing =
                    false;


                startButton.disabled =
                    false;


                stopButton.disabled =
                    true;
            }
        }



        // ==================================================
        // VOICE SELECTION
        // ==================================================

        function loadVoice() {

            const voices =
                window.speechSynthesis.getVoices();


            if (!voices.length) {

                return;
            }


            const preferredVoices = [

                "Microsoft Jenny",

                "Microsoft Aria",

                "Microsoft Zira",

                "Google UK English Female",

                "Google US English Female",

                "Samantha",

                "Karen",

                "Sonia"

            ];


            // ==================================================
            // FIRST: PREFERRED VOICES
            // ==================================================

            for (
                const preferred
                of preferredVoices
            ) {

                const match =
                    voices.find(
                        voice =>
                            voice.name
                                .toLowerCase()
                                .includes(
                                    preferred.toLowerCase()
                                )
                    );


                if (match) {

                    selectedVoice =
                        match;


                    console.log(
                        "Selected voice:",
                        selectedVoice.name
                    );


                    return;
                }
            }



            // ==================================================
            // SECOND: FEMALE-SOUNDING ENGLISH VOICE
            // ==================================================

            const femaleVoice =
                voices.find(
                    voice =>

                        voice.lang
                            .toLowerCase()
                            .startsWith("en") &&

                        /female|zira|jenny|samantha|aria|karen|sonia/i
                            .test(
                                voice.name
                            )
                );


            if (femaleVoice) {

                selectedVoice =
                    femaleVoice;


                console.log(
                    "Selected female English voice:",
                    selectedVoice.name
                );


                return;
            }



            // ==================================================
            // FINAL: ANY ENGLISH VOICE
            // ==================================================

            const englishVoice =
                voices.find(
                    voice =>
                        voice.lang
                            .toLowerCase()
                            .startsWith("en")
                );


            if (englishVoice) {

                selectedVoice =
                    englishVoice;


                console.log(
                    "Selected English voice:",
                    selectedVoice.name
                );
            }
        }



        window.speechSynthesis.onvoiceschanged =
            loadVoice;


        loadVoice();



        // ==================================================
        // CLEAN TEXT FOR SPEECH
        // ==================================================

        function cleanTextForSpeech(text) {

            if (!text) {

                return "";
            }


            let cleaned =
                String(text);



            // ==================================================
            // REMOVE MARKDOWN
            // ==================================================

            /*
             * Remove bold.
             *
             * **hello**
             *
             * becomes:
             *
             * hello
             */

            cleaned =
                cleaned.replace(
                    /\*\*(.*?)\*\*/gs,
                    "$1"
                );


            /*
             * Remove italic.
             */

            cleaned =
                cleaned.replace(
                    /\*(.*?)\*/gs,
                    "$1"
                );


            /*
             * Remove headings.
             */

            cleaned =
                cleaned.replace(
                    /^\s*#+\s*/gm,
                    ""
                );


            /*
             * Remove markdown links but keep
             * their readable text.
             */

            cleaned =
                cleaned.replace(
                    /\[([^\]]+)\]\([^)]+\)/g,
                    "$1"
                );



            // ==================================================
            // REMOVE ASTERISKS / BULLETS
            // ==================================================

            cleaned =
                cleaned.replace(
                    /[*•]/g,
                    ""
                );


            /*
             * Remove bullet markers at the beginning
             * of lines.
             */

            cleaned =
                cleaned.replace(
                    /^\s*[-+]\s+/gm,
                    ""
                );



            // ==================================================
            // CONVERT ISO DATES
            // ==================================================

            cleaned =
                cleaned.replace(
                    /\b(\d{4})-(\d{2})-(\d{2})\b/g,
                    (
                        match,
                        year,
                        month,
                        day
                    ) => {

                        const parsedDate =
                            new Date(
                                Number(year),
                                Number(month) - 1,
                                Number(day)
                            );


                        const monthName =
                            parsedDate.toLocaleString(
                                "en-US",
                                {
                                    month: "long"
                                }
                            );


                        return (
                            `${monthName} ` +
                            `${Number(day)}, ` +
                            `${year}`
                        );
                    }
                );



            // ==================================================
            // ORDINAL DATES
            // ==================================================

            /*
             * 28th -> 28
             *
             * This allows the speech engine to say
             * the date naturally.
             */

            cleaned =
                cleaned.replace(
                    /\b(\d+)(st|nd|rd|th)\b/gi,
                    "$1"
                );



            // ==================================================
            // NORMALIZE A.M. / P.M.
            // ==================================================

            /*
             * Convert:
             *
             * a.m. -> AM
             * p.m. -> PM
             */

            cleaned =
                cleaned.replace(
                    /\ba\s*\.\s*m\s*\.\s*/gi,
                    " AM "
                );


            cleaned =
                cleaned.replace(
                    /\bp\s*\.\s*m\s*\.\s*/gi,
                    " PM "
                );



            // ==================================================
            // NORMALIZE FULL-HOUR TIMES
            // ==================================================

            /*
             * Convert:
             *
             * 9:00 AM
             * 10:00 AM
             * 2:00 PM
             *
             * into:
             *
             * 9 AM
             * 10 AM
             * 2 PM
             *
             * This is VERY important because otherwise
             * browser TTS may pronounce:
             *
             * "ten zero zero AM"
             */

            cleaned =
                cleaned.replace(
                    /\b0?(\d{1,2})\s*:\s*00\s*(AM|PM)\b/gi,
                    "$1 $2"
                );



            // ==================================================
            // NORMALIZE TIME SPACING
            // ==================================================

            /*
             * 10 : 30 AM
             *
             * becomes:
             *
             * 10:30 AM
             */

            cleaned =
                cleaned.replace(
                    /\b(\d{1,2})\s*:\s*(\d{2})\s*(AM|PM)\b/gi,
                    "$1:$2 $3"
                );



            // ==================================================
            // NORMALIZE COMMON TIME WORDS
            // ==================================================

            cleaned =
                cleaned.replace(
                    /\bnoon\b/gi,
                    "12 PM"
                );


            cleaned =
                cleaned.replace(
                    /\bmidnight\b/gi,
                    "12 AM"
                );



            // ==================================================
            // REMOVE INVISIBLE / UNUSUAL SPACES
            // ==================================================

            cleaned =
                cleaned.replace(
                    /[\u00A0\u202F]/g,
                    " "
                );



            // ==================================================
            // NORMALIZE PUNCTUATION SPACING
            // ==================================================

            cleaned =
                cleaned.replace(
                    /\s+([,.!?;:])/g,
                    "$1"
                );


            cleaned =
                cleaned.replace(
                    /([,.!?;:])([^\s])/g,
                    "$1 $2"
                );



            // ==================================================
            // NORMALIZE DASHES
            // ==================================================

            /*
             * A model may produce:
             *
             * "Great—10 AM is available."
             *
             * Convert the dash to a comma so the
             * browser creates a natural conversational
             * pause.
             */

            cleaned =
                cleaned.replace(
                    /\s*[—–]\s*/g,
                    ", "
                );



            // ==================================================
            // REMOVE REPEATED PUNCTUATION
            // ==================================================

            cleaned =
                cleaned.replace(
                    /\.{2,}/g,
                    "."
                );


            cleaned =
                cleaned.replace(
                    /!{2,}/g,
                    "!"
                );


            cleaned =
                cleaned.replace(
                    /\?{2,}/g,
                    "?"
                );



            // ==================================================
            // NORMALIZE WHITESPACE
            // ==================================================

            cleaned =
                cleaned.replace(
                    /[ \t]+/g,
                    " "
                );


            cleaned =
                cleaned.replace(
                    /\n{2,}/g,
                    "\n"
                );


            return cleaned.trim();
        }



        // ==================================================
        // PREPARE SPEECH TEXT
        // ==================================================

        function prepareSpeechText(text) {

            let speechText =
                cleanTextForSpeech(text);


            if (!speechText) {

                return "";
            }


            /*
             * Remove any remaining standalone
             * formatting characters.
             */

            speechText =
                speechText.replace(
                    /[`_~|<>]/g,
                    ""
                );


            /*
             * Remove repeated spaces.
             */

            speechText =
                speechText.replace(
                    /\s+/g,
                    " "
                );


            /*
             * Remove trailing commas/spaces.
             */

            speechText =
                speechText.replace(
                    /[\s,]+$/,
                    ""
                );


            return speechText.trim();
        }



        // ==================================================
        // DETECT APPOINTMENT LIST
        // ==================================================

        function isAppointmentList(
            text
        ) {

            const timePattern =
                /\b\d{1,2}(?::\d{2})?\s*(?:AM|PM)\b/gi;


            const matches =
                text.match(
                    timePattern
                );


            return (
                matches &&
                matches.length >= 2
            );
        }



        // ==================================================
        // CREATE APPOINTMENT LIST CHUNKS
        // ==================================================

        function createAppointmentChunks(
            speechText
        ) {

            if (!speechText) {

                return [
                    {
                        text: "",
                        pause: 0
                    }
                ];
            }


            let naturalText =
                speechText;


            // ==================================================
            // NORMALIZE FULL-HOUR TIMES
            // ==================================================

            naturalText =
                naturalText.replace(
                    /\b(\d{1,2}):00\s*(AM|PM)\b/gi,
                    "$1 $2"
                );


            // ==================================================
            // NORMALIZE AM / PM
            // ==================================================

            naturalText =
                naturalText.replace(
                    /\ba\.m\./gi,
                    "AM"
                );


            naturalText =
                naturalText.replace(
                    /\bp\.m\./gi,
                    "PM"
                );


            // ==================================================
            // REMOVE MARKDOWN
            // ==================================================

            naturalText =
                naturalText.replace(
                    /\*\*/g,
                    ""
                );


            naturalText =
                naturalText.replace(
                    /\*/g,
                    ""
                );


            // ==================================================
            // NORMALIZE WHITESPACE
            // ==================================================

            naturalText =
                naturalText.replace(
                    /\s+/g,
                    " "
                );


            // ==================================================
            // CLEAN TRAILING PUNCTUATION
            // ==================================================

            naturalText =
                naturalText.replace(
                    /[\s,]+$/,
                    ""
                );


            return [
                {
                    /*
                     * Speak the entire appointment list as
                     * ONE utterance.
                     *
                     * This is much more reliable in Chrome
                     * than creating one utterance per time.
                     */

                    text:
                        naturalText,

                    pause:
                        0
                }
            ];
        }



        // ==================================================
        // CREATE CONFIRMATION CHUNKS
        // ==================================================

        function createConfirmationChunks(
            speechText
        ) {

            /*
             * Example:
             *
             * "Your appointment is booked for
             * tomorrow, August 28th, at 10 AM."
             *
             * We want meaningful pauses rather than
             * one rushed sentence.
             */

            const confirmationPattern =
                /^(.*?\b(?:confirmed|booked)\b)(.*?\b(?:for|at)\b\s+\d{1,2}(?::\d{2})?\s*(?:AM|PM)\b)(.*)$/i;


            const match =
                speechText.match(
                    confirmationPattern
                );


            if (!match) {

                return null;
            }


            const chunks =
                [];


            const opening =
                match[1]
                    .trim();


            const timePart =
                match[2]
                    .trim();


            const ending =
                match[3]
                    .trim()
                    .replace(
                        /^[,.\s]+/,
                        ""
                    );


            if (opening) {

                chunks.push(
                    {
                        text:
                            opening,

                        pause:
                            500
                    }
                );
            }


            if (timePart) {

                chunks.push(
                    {
                        text:
                            timePart,

                        pause:
                            600
                    }
                );
            }


            if (ending) {

                chunks.push(
                    {
                        text:
                            ending,

                        pause:
                            0
                    }
                );
            }


            return chunks;
        }



        // ==================================================
        // CREATE NATURAL SENTENCE CHUNKS
        // ==================================================

        function createNaturalSentenceChunks(
            speechText
        ) {

            /*
             * We do NOT split every comma into a separate
             * utterance because that sounds robotic.
             *
             * Instead, split only at actual sentence
             * boundaries.
             */

            const chunks =
                [];


            /*
             * Sentence boundary:
             *
             * .
             * !
             * ?
             *
             * followed by a space.
             */

            const sentencePattern =
                /[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/g;


            const matches =
                speechText.match(
                    sentencePattern
                );


            if (!matches) {

                return [
                    {
                        text:
                            speechText,

                        pause:
                            0
                    }
                ];
            }


            matches.forEach(
                (
                    sentence,
                    index
                ) => {

                    const cleanedSentence =
                        sentence.trim();


                    if (!cleanedSentence) {

                        return;
                    }


                    const isQuestion =
                        /\?\s*$/.test(
                            cleanedSentence
                        );


                    const isExclamation =
                        /!\s*$/.test(
                            cleanedSentence
                        );


                    /*
                     * Natural pause after a complete
                     * sentence.
                     */

                    let pause =
                        350;


                    if (isQuestion) {

                        pause =
                            550;
                    }


                    if (isExclamation) {

                        pause =
                            450;
                    }


                    /*
                     * No need for a large pause after
                     * the very final sentence.
                     */

                    if (
                        index ===
                        matches.length - 1
                    ) {

                        pause =
                            0;
                    }


                    chunks.push(
                        {
                            text:
                                cleanedSentence,

                            pause:
                                pause
                        }
                    );
                }
            );


            /*
             * Fallback if chunking produced nothing.
             */

            if (!chunks.length) {

                return [
                    {
                        text:
                            speechText,

                        pause:
                            0
                    }
                ];
            }


            return chunks;
        }



        // ==================================================
        // TEXT TO SPEECH
        // ==================================================

        function speak(text) {

            if (!text) {

                return;
            }


            const speechText =
                prepareSpeechText(text);


            if (!speechText) {

                return;
            }


            /*
             * Stop previous speech and invalidate
             * previous callbacks.
             */

            stopSpeech();


            /*
             * Capture this speech generation.
             *
             * If Stop is pressed later, this value
             * will no longer match speechGeneration.
             */

            const myGeneration =
                speechGeneration;


            isSpeaking =
                true;


            startButton.disabled =
                true;


            stopButton.disabled =
                false;


            status.textContent =
                "CareFlow AI is speaking...";


            // ==================================================
            // SELECT SPEECH MODE
            // ==================================================

            let chunks;


            /*
             * Appointment list:
             *
             * "I have 10 AM, 2 PM, and 3:30 PM available."
             */

            if (
                isAppointmentList(
                    speechText
                )
            ) {

                chunks =
                    createAppointmentChunks(
                        speechText
                    );

            } else {

                /*
                 * Appointment confirmation.
                 */

                const confirmationChunks =
                    createConfirmationChunks(
                        speechText
                    );


                if (confirmationChunks) {

                    chunks =
                        confirmationChunks;

                } else {

                    /*
                     * Normal conversational speech.
                     */

                    chunks =
                        createNaturalSentenceChunks(
                            speechText
                        );
                }
            }



            // ==================================================
            // SPEAK CHUNKS SEQUENTIALLY
            // ==================================================

            let currentChunk =
                0;


            function speakNextChunk() {

                /*
                 * Make sure this speech session
                 * is still valid.
                 */

                if (
                    !isSpeaking ||
                    myGeneration !==
                    speechGeneration
                ) {

                    return;
                }


                // ==================================================
                // FINISHED
                // ==================================================

                if (
                    currentChunk >=
                    chunks.length
                ) {

                    isSpeaking =
                        false;


                    /*
                     * If the user pressed Stop,
                     * do not restart the microphone.
                     */

                    if (!voiceSessionActive) {

                        startButton.disabled =
                            false;

                        stopButton.disabled =
                            true;

                        status.textContent =
                            "Ready.";

                        return;
                    }


                    /*
                     * If there is still processing work,
                     * wait for it to finish.
                     */

                    if (isProcessing) {

                        startButton.disabled =
                            true;

                        stopButton.disabled =
                            false;

                        status.textContent =
                            "Thinking...";

                        return;
                    }


                    /*
                     * The assistant has finished speaking
                     * and the current request is complete.
                     *
                     * Automatically reopen the microphone
                     * for the next user turn.
                     */

                    startButton.disabled =
                        true;


                    stopButton.disabled =
                        false;


                    status.textContent =
                        "Listening... Speak now.";


                    /*
                     * Small delay prevents Chrome from
                     * trying to start recognition at the
                     * exact moment speech synthesis finishes.
                     */

                    setTimeout(
                        () => {

                            if (
                                voiceSessionActive &&
                                !isListening &&
                                !isSpeaking &&
                                !isProcessing
                            ) {

                                try {

                                    recognition.start();

                                } catch (error) {

                                    console.debug(
                                        "Recognition restart skipped:",
                                        error
                                    );
                                }
                            }

                        },
                        250
                    );


                    return;
                }


                const chunk =
                    chunks[currentChunk];


                if (
                    !chunk.text ||
                    !chunk.text.trim()
                ) {

                    currentChunk++;

                    speakNextChunk();

                    return;
                }



                // ==================================================
                // CREATE UTTERANCE
                // ==================================================

                const utterance =
                    new SpeechSynthesisUtterance(
                        chunk.text
                    );


                // ==================================================
                // VOICE
                // ==================================================

                if (selectedVoice) {

                    utterance.voice =
                        selectedVoice;
                }


                utterance.lang =
                    "en-US";



                // ==================================================
                // NATURAL HUMAN DELIVERY
                // ==================================================

                /*
                 * Slightly slower than default.
                 *
                 * This makes the receptionist sound
                 * conversational rather than like it
                 * is reading text.
                 */

                utterance.rate =
                    0.88;


                utterance.pitch =
                    1.02;


                utterance.volume =
                    1.0;



                // ==================================================
                // SPEECH START
                // ==================================================

                utterance.onstart =
                    () => {

                        if (
                            !isSpeaking ||
                            myGeneration !==
                            speechGeneration
                        ) {

                            window.speechSynthesis.cancel();

                            return;
                        }


                        status.textContent =
                            "CareFlow AI is speaking...";
                    };



                // ==================================================
                // SPEECH END
                // ==================================================

                utterance.onend =
                    () => {

                        if (
                            !isSpeaking ||
                            myGeneration !==
                            speechGeneration
                        ) {

                            return;
                        }


                        currentChunk++;


                        /*
                         * Real pause between chunks.
                         *
                         * This is much more reliable
                         * than putting dots into the text.
                         */

                        if (
                            chunk.pause >
                            0
                        ) {

                            speechPauseTimer =
                                setTimeout(
                                    () => {

                                        speechPauseTimer =
                                            null;


                                        if (
                                            isSpeaking &&
                                            myGeneration ===
                                            speechGeneration
                                        ) {

                                            speakNextChunk();
                                        }

                                    },
                                    chunk.pause
                                );

                        } else {

                            speakNextChunk();
                        }
                    };



                // ==================================================
                // SPEECH ERROR
                // ==================================================

                utterance.onerror =
                    (event) => {

                        /*
                         * Chrome reports "interrupted"
                         * when speechSynthesis.cancel()
                         * is intentionally called.
                         */

                        if (
                            event.error ===
                            "interrupted"
                        ) {

                            return;
                        }


                        console.error(
                            "Speech synthesis error:",
                            event
                        );


                        if (
                            myGeneration !==
                            speechGeneration
                        ) {

                            return;
                        }


                        isSpeaking =
                            false;


                        if (
                            speechPauseTimer !==
                            null
                        ) {

                            clearTimeout(
                                speechPauseTimer
                            );

                            speechPauseTimer =
                                null;
                        }


                        startButton.disabled =
                            isProcessing;


                        stopButton.disabled =
                            !isProcessing;


                        status.textContent =
                            "Voice output failed.";
                    };



                // ==================================================
                // SPEAK
                // ==================================================

                window.speechSynthesis.speak(
                    utterance
                );
            }



            // ==================================================
            // START SPEECH
            // ==================================================

            speakNextChunk();
        }



        // ==================================================
        // DISPLAY CONVERSATION
        // ==================================================

        function addMessage(
            sender,
            text,
            className
        ) {

            const message =
                document.createElement(
                    "div"
                );


            message.className =
                "message " +
                className;


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "label";


            label.textContent =
                sender;


            const content =
                document.createElement(
                    "div"
                );


            /*
             * SECURITY:
             *
             * Use textContent rather than
             * innerHTML so model-generated
             * HTML or JavaScript cannot execute.
             */

            content.textContent =
                text;


            message.appendChild(
                label
            );


            message.appendChild(
                content
            );


            conversation.appendChild(
                message
            );


            conversation.scrollTop =
                conversation.scrollHeight;
        }


    </script>
